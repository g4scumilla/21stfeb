name: Auto-Publish My Store APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: write

jobs:
  auto-publish:
    name: Build, Sign & Publish Store Update
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Signing Secrets Exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice::Signing secrets not configured yet. Skipping auto-publish until secrets are set."
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" >/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract Version Info from Gradle
        id: version
        run: |
          VERSION_NAME=$(python3 -c '
          import re
          text = open("app/build.gradle.kts").read()
          m = re.search(r"versionName\s*=\s*\"([^\"]+)\"", text)
          print(m.group(1) if m else "1.0.0")
          ')
          VERSION_CODE=$(python3 -c '
          import re
          text = open("app/build.gradle.kts").read()
          m = re.search(r"versionCode\s*=\s*(\d+)", text)
          print(m.group(1) if m else "1")
          ')
          RUN_NUM="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME-$RUN_NUM" >> $GITHUB_OUTPUT
          echo "Release: v$VERSION_NAME (code $VERSION_CODE, run $RUN_NUM)"

      - name: Run Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Decode Permanent Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw = os.environ.get("KEYSTORE_B64", "")
          clean = re.sub(r"\s+", "", raw)
          data = base64.b64decode(clean, validate=True)
          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "my-upload-key.jks"
          out.write_bytes(data)
          os.chmod(out, 0o600)
          print(f"Decoded keystore OK ({len(data)} bytes).")
          PY

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK Signature & Generate SHA-256 Checksum
        id: pkg
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="MyStore-v${{ steps.version.outputs.version_name }}-${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_DEST"
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          SIZE=$(wc -c < "$APK_DEST" | tr -d ' ')
          echo "$SHA256  $APK_DEST" > "${APK_DEST}.sha256"
          echo "apk_file=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "sha_file=${APK_DEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Update Central Catalog (docs/data/catalog.json)
        run: |
          python3 scripts/update-catalog.py \
            --catalog docs/data/catalog.json \
            --package-name com.mystore.app \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.pkg.outputs.apk_file }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}" \
            --sha256 "${{ steps.pkg.outputs.sha256 }}" \
            --size-bytes "${{ steps.pkg.outputs.size_bytes }}" \
            --release-notes "Auto-published update from AI Studio push (${{ github.sha }})"

      - name: Commit Catalog Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "${{ github.workspace }}/my-upload-key.jks"
          git add docs/data/catalog.json
          git diff --cached --quiet || git commit -m "chore: auto-update catalog for v${{ steps.version.outputs.version_name }}"
          git push || true

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag_name }}" \
            "${{ steps.pkg.outputs.apk_file }}" \
            "${{ steps.pkg.outputs.sha_file }}" \
            --title "My Store v${{ steps.version.outputs.version_name }} (Build ${{ github.run_number }})" \
            --notes "Automated signed release from AI Studio push. SHA-256: \`${{ steps.pkg.outputs.sha256 }}\`"
