name: Production Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semantic version name (e.g. 1.0.0)"
        required: true
        type: string
      version_code:
        description: "Strictly increasing integer versionCode (e.g. 1)"
        required: true
        type: string
      release_notes:
        description: "Release notes shown in My Store & GitHub Release"
        required: false
        default: "Initial signed release of My Store."
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Test, Sign & Publish My Store APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Version Inputs & Prevent Duplicate Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version_name }}
        run: |
          if ! [[ "${{ inputs.version_code }}" =~ ^[0-9]+$ ]] || [ "${{ inputs.version_code }}" -lt 1 ]; then
            echo "::error::version_code must be a positive integer."
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG_NAME already exists. Never overwrite an existing release!"
            exit 1
          fi

      - name: Verify Signing Secrets Exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Stamp Release Version in app/build.gradle.kts
        run: |
          python3 -c '
          import re, pathlib
          p = pathlib.Path("app/build.gradle.kts")
          text = p.read_text()
          text = re.sub(r"versionCode\s*=\s*\d+", "versionCode = ${{ inputs.version_code }}", text)
          text = re.sub(r"versionName\s*=\s*\"[^\"]+\"", "versionName = \"${{ inputs.version_name }}\"", text)
          p.write_text(text)
          '

      - name: Run Automated Tests Before Release
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Decode Permanent Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          chmod 600 "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK Signature & Generate SHA-256 Checksum
        id: pkg
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="MyStore-v${{ inputs.version_name }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_DEST"
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          SIZE=$(wc -c < "$APK_DEST" | tr -d ' ')
          echo "$SHA256  $APK_DEST" > "${APK_DEST}.sha256"
          echo "apk_file=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "sha_file=${APK_DEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Update Central Catalog (docs/data/catalog.json)
        run: |
          python3 scripts/update-catalog.py \
            --catalog docs/data/catalog.json \
            --package-name com.mystore.app \
            --version-name "${{ inputs.version_name }}" \
            --version-code "${{ inputs.version_code }}" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version_name }}/${{ steps.pkg.outputs.apk_file }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version_name }}" \
            --sha256 "${{ steps.pkg.outputs.sha256 }}" \
            --size-bytes "${{ steps.pkg.outputs.size_bytes }}" \
            --release-notes "${{ inputs.release_notes }}"

      - name: Commit Version & Catalog Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "${{ github.workspace }}/my-upload-key.jks"
          git add app/build.gradle.kts docs/data/catalog.json
          git diff --cached --quiet || git commit -m "release: My Store v${{ inputs.version_name }} (code ${{ inputs.version_code }})"
          git push

      - name: Create GitHub Release & Upload Signed APK + SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version_name }}" \
            "${{ steps.pkg.outputs.apk_file }}" \
            "${{ steps.pkg.outputs.sha_file }}" \
            --title "My Store v${{ inputs.version_name }}" \
            --notes "${{ inputs.release_notes }}

          **SHA-256:** \`${{ steps.pkg.outputs.sha256 }}\`"
